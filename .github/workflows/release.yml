name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  PYINSTALLER_ARGS: >-
    --onefile
    --name unifi-gateway
    --hidden-import Crypto.Cipher._mode_cbc
    --hidden-import Crypto.Cipher._mode_gcm
    --hidden-import Crypto.Cipher._mode_ecb
    --hidden-import Crypto.Util.Padding
    --hidden-import Crypto.Random
    unifi_gateway.py

jobs:
  # ── Build PyInstaller binaries ──────────────────────────────────────

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            suffix: linux-amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            suffix: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
          - arch: armhf
            platform: linux/arm/v7
            suffix: linux-armhf
            deb_arch: armhf
            rpm_arch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary + packages
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/build -w /build \
            python:3.12-slim bash -c '
              set -e
              apt-get update && apt-get install -y --no-install-recommends \
                gcc libc6-dev zlib1g-dev dpkg-dev debhelper binutils build-essential

              # Build PyInstaller binary
              pip install --no-cache-dir -r requirements.txt pyinstaller
              pyinstaller ${{ env.PYINSTALLER_ARGS }}
              ./dist/unifi-gateway --help
              cp dist/unifi-gateway dist/unifi-gateway-${{ matrix.suffix }}

              # Build .deb
              sed -i "1s/([^)]*)/('"${{ steps.version.outputs.version }}"'-1)/" debian/changelog
              dpkg-buildpackage -us -uc -b -a${{ matrix.deb_arch }}
              mkdir -p output
              mv ../*.deb output/
            '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/unifi-gateway-${{ matrix.suffix }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: output/*.deb

      - name: Build RPM
        if: matrix.rpm_arch != ''
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/build -w /build \
            rockylinux:9 bash -c '
              set -e
              VERSION='"${{ steps.version.outputs.version }}"'
              RPM_VERSION=$(echo "$VERSION" | tr - .)
              dnf install -y rpm-build systemd-rpm-macros

              mkdir -p /root/rpmbuild/{SOURCES,SPECS}
              tar czf /root/rpmbuild/SOURCES/unifi-gateway-${RPM_VERSION}.tar.gz \
                --transform "s,^\.,unifi-gateway-${RPM_VERSION}," \
                --exclude=.git --exclude=__pycache__ --exclude=poc .
              cp rpm/unifi-gateway.spec /root/rpmbuild/SPECS/
              rpmbuild -bb --define "_version ${RPM_VERSION}" /root/rpmbuild/SPECS/unifi-gateway.spec
              mkdir -p /build/output
              cp /root/rpmbuild/RPMS/*/*.rpm /build/output/
            '

      - name: Upload RPM
        if: matrix.rpm_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: output/*.rpm

  build-freebsd:
    runs-on: [self-hosted, freebsd]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt pyinstaller

      - name: Build binary
        run: |
          python3 -m PyInstaller ${{ env.PYINSTALLER_ARGS }}
          ./dist/unifi-gateway --help
          cp dist/unifi-gateway dist/unifi-gateway-freebsd-amd64

      - name: Build FreeBSD .pkg
        run: |
          chmod +x pkg/freebsd/build-pkg.sh
          sh pkg/freebsd/build-pkg.sh "${{ steps.version.outputs.version }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-freebsd-amd64
          path: dist/unifi-gateway-freebsd-amd64

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pkg-freebsd-amd64
          path: dist/*.pkg

      - name: Clean up
        if: always()
        run: rm -rf build dist repo *.spec

  # ── OpenWRT packages (pure Python, arch-independent) ──────────────

  build-openwrt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .ipk (opkg, pre-25.12)
        run: |
          chmod +x pkg/openwrt/build-ipk.sh
          ./pkg/openwrt/build-ipk.sh "${{ steps.version.outputs.version }}"

      - name: Build .apk (apk, 25.12+)
        run: |
          chmod +x pkg/openwrt/build-apk.sh
          ./pkg/openwrt/build-apk.sh "${{ steps.version.outputs.version }}"

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipk
          path: dist/*.ipk

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk
          path: dist/*.apk

  # ── Docker multi-arch image ────────────────────────────────────────

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/amd989/unifi-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── GitHub Release ─────────────────────────────────────────────────

  release:
    needs: [build-linux, build-freebsd, build-openwrt]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: binary-*
          merge-multiple: true

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '{deb,rpm,pkg,openwrt}-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/unifi-gateway-*
            packages/*.deb
            packages/*.rpm
            packages/*.pkg
            packages/*.ipk
            packages/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Packages are published centrally by amd989/packages, which serves
  # packages.alejandro.md. This repository builds, attaches the artifacts to
  # its own GitHub Release, and asks the publisher to pick that release up.
  # The signing key and the storage credentials live only over there.
  publish:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to packages.alejandro.md
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PACKAGES_DISPATCH_TOKEN is not set. The release exists, but packages.alejandro.md was not asked to publish it. Set the secret, then run the publish workflow in amd989/packages by hand for $REPO $TAG."
            exit 1
          fi
          # -f rather than -F: -F converts values that look like numbers or
          # booleans, and the publisher expects the tag as a string.
          gh api repos/amd989/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[tag]=$TAG"
          {
            echo "### Asked packages.alejandro.md to publish \`$REPO\` \`$TAG\`"
            echo
            echo "Follow it at https://github.com/amd989/packages/actions/workflows/publish.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
