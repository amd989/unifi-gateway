[global]
pid_file = unifi-gateway.pid
disable_broadcast = True

[gateway]
is_adopted = False
ports = [ { "ifname": "eth0", "name": "WAN", "type": "wan", "realif": "eth1" }, { "ifname": "eth1", "name": "LAN", "type": "lan", "realif": "br-lan" }, { "ifname": "eth2", "name": "LAN2", "type": "lan2", "realif": "eth2" } ]
lan_ip = 192.168.1.1
lan_mac = 00:00:00:00:00:00
firmware = 4.4.18.5052168
device = UGW3
device_display = UniFi-Gateway-3
use_aes_gcm = False
# hostname = my-gateway
# dhcp_lease_file = /tmp/dhcp.leases
# dhcp_lease_format = dnsmasq  ; dnsmasq, isc, or kea
# ping_target = ping.ubnt.com
# speedtest_file = ./speedtest.json
# platform = UNIFI-GW

# Optional, OpenWrt only: apply the controller's DHCP pool and reservations (see README "[openwrt]")
# [openwrt]
# dhcp_sync_enabled = True
# dhcp_sync_mode = dry-run
# dhcp_sync_network = 192.168.1.0/24
# dhcp_controller_url = https://192.168.1.10:8443
# dhcp_controller_credentials_file = /etc/unifi-gateway/controller-credentials.json
# The controller certificate's SHA-256 fingerprint (see README)
# dhcp_controller_cert_sha256 = AB:CD:...

[provisioned]
