[global]
pid_file = unifi-gateway.pid
disable_broadcast = True

[gateway]
is_adopted = False
# Read everything from the OPNsense REST API instead of the local machine
platform = opnsense-api
# realif = the OPNsense device (igc0, vlan01) or interface identifier (wan, lan, opt1)
ports = [ { "ifname": "eth0", "name": "WAN", "type": "wan", "realif": "wan" }, { "ifname": "eth1", "name": "LAN", "type": "lan", "realif": "lan" } ]
# OPNsense's LAN address and LAN MAC: this is how the controller identifies the "gateway"
lan_ip = 192.168.1.1
lan_mac = 00:00:00:00:00:00
firmware = 4.4.18.5052168
device = UGW3
device_display = UniFi-Gateway-3
use_aes_gcm = False
# hostname = my-gateway   ; default: the OPNsense hostname

[opnsense]
# Can also come from OPNSENSE_API_URL / OPNSENSE_API_KEY / OPNSENSE_API_SECRET(_FILE) / OPNSENSE_VERIFY_SSL
# api_url = https://192.168.1.1
# api_key =
# api_secret =
# api_secret_file = /run/secrets/opnsense_api_secret
# verify_ssl = true          ; true, false, or a path to a CA/cert file
# timeout = 10
# dhcp_backend = auto        ; auto, kea, dnsmasq, isc, none
# wan_gateway = WAN_DHCP     ; gateway name for latency; default: the WAN interface's gateway
# latency_source = gateway   ; gateway (dpinger on OPNsense) or ping (from this host)
# nameservers = 1.1.1.1,9.9.9.9   ; default: DNS received on WAN, else the LAN IP
# cpu_interval = 60          ; seconds between CPU samples (runs top on OPNsense, ~2s); 0 disables

[provisioned]
